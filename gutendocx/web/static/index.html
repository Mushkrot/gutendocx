<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GutenDocx Cover UI (MVP)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    .row { margin-bottom: 12px; }
    label { display: inline-block; min-width: 160px; }
    input[type=text] { width: 420px; }
    textarea { width: 100%; height: 260px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    button { margin-right: 8px; }
    .hint { color: #666; font-size: 12px; }
    .card { border: 1px solid #e9e9e9; border-radius: 8px; padding: 12px; background: #fafafa; margin: 8px 0; }
    .card h3 { margin: 0 0 8px 0; font-size: 14px; font-weight: 600; }
    .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .inline label { min-width: unset; }
    .w-280 { width: 280px; }
    .w-120 { width: 120px; }
    .muted { opacity: 0.6; }
    /* Emphasized Override control */
    .override { font-weight: 800; color: #111; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
    .override input[type="checkbox"] { width: 28px; height: 28px; accent-color: #2563eb; cursor: pointer; }
    /* Keep the Override control readable even when card is muted */
    .card.muted .override { opacity: 1; }
    .busy-backdrop { position: fixed; inset: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .busy-box { display: flex; flex-direction: column; align-items: center; gap: 12px; color: #111; font-weight: 700; }
    .spinner { width: 48px; height: 48px; border: 4px solid #cfd8dc; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast-container { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 1100; }
    .toast { background: #111; color: #fff; padding: 10px 12px; border-radius: 8px; min-width: 220px; box-shadow: 0 6px 16px rgba(0,0,0,0.15); opacity: 0.95; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
  </style>
</head>
<body>
  <h1>GutenDocx — Cover UI (MVP)</h1>
  <div class="row">
    <label for="inputPath">Input DOCX path</label>
    <input id="inputPath" type="text" value="Simples/test2.docx" />
    <select id="docPicker" style="margin-left:8px; min-width:240px;"></select>
  </div>
  <div class="row">
    <label for="configPath">Config path (optional)</label>
    <input id="configPath" type="text" value="config.yaml" />
  </div>
  <div class="row">
    <label>Scope</label>
    <label><input id="scopeCover" type="radio" name="scope" value="cover" checked /> Cover only</label>
    <label><input id="scopeWhole" type="radio" name="scope" value="whole" /> Whole document</label>
  </div>
  <div class="row">
    <label>Options</label>
    <label><input id="vision" type="checkbox" checked /> Vision</label>
    <label><input id="dryRun" type="checkbox" checked /> Dry run</label>
    <label><input id="noLayout" type="checkbox" checked /> No layout</label>
  </div>
  <div class="row" id="confRow">
    <label for="minConf">Min confidence</label>
    <input id="minConf" type="range" min="0.3" max="0.9" step="0.05" value="0.6" />
    <span id="minConfVal" class="hint" style="margin-left:8px;">0.60</span>
  </div>
  <div class="row">
    <label for="modelSel">Model</label>
    <select id="modelSel">
      <option value="gpt-5-mini">GPT-5 Mini</option>
      <option value="gpt-5">GPT-5</option>
      <option value="gpt-5-nano">GPT-5 Nano</option>
      <option value="gpt-4o">GPT-4o</option>
      <option value="gpt-4o-mini" selected>GPT-4o Mini (Recommended)</option>
      <option value="gpt-4.1">GPT-4.1</option>
      <option value="gpt-4.1-mini">GPT-4.1 Mini</option>
      <option value="gpt-4.1-nano">GPT-4.1 Nano</option>
    </select>
    <span id="costEst" class="hint" style="margin-left:8px;">~$0.000</span>
  </div>
  <div class="row">
    <button id="btnAnalyze">Analyze</button>
    <button id="btnApply">Apply</button>
    <span class="hint">Analyze = preview JSON. Apply = write styles and save DOCX.</span>
  </div>
  <div class="row" id="coverScope" style="border-top:1px solid #eee; padding-top:12px;">
    <label>Cover styles</label>
    <div>
      <details open>
        <summary>Title</summary>
        <div class="card" id="cardTitle">
          <div class="inline"><label class="override"><input id="ovTitle" type="checkbox" /> Override</label></div>
          <div class="inline">
            <label>Family</label>
            <input id="titleFamily" class="w-280" type="text" placeholder="Times New Roman" />
            <select id="titleFontSel" class="w-280"></select>
          </div>
          <div class="inline">
            <label>Size (pt)</label>
            <input id="titleSize" class="w-120" type="number" min="6" max="96" step="1" placeholder="28" />
            <select id="titleSizeSel" class="w-120"></select>
            <label><input id="titleBold" type="checkbox" /> Bold</label>
            <label><input id="titleAllCaps" type="checkbox" /> All caps</label>
            <label>Align</label>
            <select id="titleAlign" class="w-120">
              <option value="">(keep)</option>
              <option value="left">left</option>
              <option value="center">center</option>
              <option value="right">right</option>
            </select>
          </div>
        </div>
      </details>
      <details open>
        <summary>Subtitle</summary>
        <div class="card" id="cardSubtitle">
          <div class="inline"><label class="override"><input id="ovSubtitle" type="checkbox" /> Override</label></div>
          <div class="inline">
            <label>Family</label>
            <input id="subtitleFamily" class="w-280" type="text" placeholder="Times New Roman" />
            <select id="subtitleFontSel" class="w-280"></select>
          </div>
          <div class="inline">
            <label>Size (pt)</label>
            <input id="subtitleSize" class="w-120" type="number" min="6" max="96" step="1" placeholder="18" />
            <select id="subtitleSizeSel" class="w-120"></select>
            <label><input id="subtitleBold" type="checkbox" /> Bold</label>
            <label><input id="subtitleAllCaps" type="checkbox" /> All caps</label>
            <label>Align</label>
            <select id="subtitleAlign" class="w-120">
              <option value="">(keep)</option>
              <option value="left">left</option>
              <option value="center">center</option>
              <option value="right">right</option>
            </select>
          </div>
        </div>
      </details>
      <details open>
        <summary>Author</summary>
        <div class="card" id="cardAuthor">
          <div class="inline"><label class="override"><input id="ovAuthor" type="checkbox" /> Override</label></div>
          <div class="inline">
            <label>Family</label>
            <input id="authorFamily" class="w-280" type="text" placeholder="Times New Roman" />
            <select id="authorFontSel" class="w-280"></select>
          </div>
          <div class="inline">
            <label>Size (pt)</label>
            <input id="authorSize" class="w-120" type="number" min="6" max="96" step="1" placeholder="16" />
            <select id="authorSizeSel" class="w-120"></select>
            <label><input id="authorBold" type="checkbox" /> Bold</label>
            <label><input id="authorAllCaps" type="checkbox" /> All caps</label>
            <label>Align</label>
            <select id="authorAlign" class="w-120">
              <option value="">(keep)</option>
              <option value="left">left</option>
              <option value="center">center</option>
              <option value="right">right</option>
            </select>
          </div>
        </div>
      </details>
    </div>
  </div>
  <div class="row" id="wholeScope" style="border-top:1px solid #eee; padding-top:12px; margin-top:8px;">
    <label>Whole document</label>
    <div>
      <details open>
        <summary>Text styles (beyond cover)</summary>
        <div class="card" id="cardWhole">
          <div class="inline">
            <span class="hint">This section will control all pages after the cover. Current step: detect and list all styles used in the document.</span>
          </div>
          <div class="inline">
            <label for="docStyles">Detected styles</label>
            <select id="docStyles" multiple size="6" class="w-280" style="min-width:260px;"></select>
          </div>
        </div>
      </details>
    </div>
  </div>
  <div class="row" id="previewRow" style="display:none;">
    <label>Preview</label>
    <div id="imgWrap" style="position:relative; display:inline-block; border:1px solid #ddd;">
      <img id="coverImg" alt="rendered cover" style="max-width:640px; display:block;" />
      <canvas id="overlay" style="position:absolute; left:0; top:0; pointer-events:none;"></canvas>
    </div>
    <div>
      <label><input id="toggleOverlay" type="checkbox" checked /> Show overlay</label>
      <label style="margin-left:8px;"><input id="showTitle" type="checkbox" checked /> Title</label>
      <label style="margin-left:8px;"><input id="showSubtitle" type="checkbox" checked /> Subtitle</label>
      <label style="margin-left:8px;"><input id="showAuthor" type="checkbox" checked /> Author</label>
      <div id="legend" class="hint" style="margin-top:6px;">
        <span style="display:inline-block; width:12px; height:12px; background:#e91e63; margin-right:4px; border:1px solid #e91e63;"></span> Title
        <span style="display:inline-block; width:12px; height:12px; background:#4caf50; margin:0 4px 0 12px; border:1px solid #4caf50;"></span> Subtitle
        <span style="display:inline-block; width:12px; height:12px; background:#3f51b5; margin:0 4px 0 12px; border:1px solid #3f51b5;"></span> Author
      </div>
    </div>
  </div>
  <div class="row">
    <label>Result</label>
    <textarea id="output" readonly></textarea>
  </div>

  <div id="busy" class="busy-backdrop" style="display:none;">
    <div class="busy-box">
      <div class="spinner"></div>
      <div id="busyText">Working…</div>
    </div>
  </div>
  <div id="toasts" class="toast-container"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const api = (p) => `${location.origin}${p}`;
    const FONTS = [
      "Times New Roman","Georgia","Garamond","Book Antiqua","Palatino Linotype",
      "Cambria","Calibri","Arial","Helvetica","PT Serif","Baskerville",
      "Courier New","Verdana"
    ];
    const SIZE_PRESETS = [10,11,12,13,14,16,18,20,22,24,26,28,30,32,36,40,44,48,56,64];

    // Pricing per 1M tokens (approx, from user's table)
    const PRICES = {
      "gpt-4o": { in: 2.50, out: 10.00 },
      "gpt-4o-mini": { in: 0.15, out: 0.60 },
      "gpt-4.1": { in: 2.00, out: 8.00 },
      "gpt-4.1-mini": { in: 0.40, out: 1.60 },
      "gpt-4.1-nano": { in: 0.10, out: 0.40 },
      "gpt-5": { in: 1.25, out: 10.00 },
      "gpt-5-mini": { in: 0.25, out: 2.00 },
      "gpt-5-nano": { in: 0.05, out: 0.40 },
    };

    // Rough token estimates per request (Vision ON)
    // One image + concise JSON output
    const EST_PROMPT_TOKENS = 300;   // instruction + system
    const EST_IMAGE_TOKENS  = 1200;  // compressed image embedding (approx)
    const EST_OUTPUT_TOKENS = 250;   // JSON result

    function estimateCost() {
      const vision = $("vision").checked;
      const model = $("modelSel").value;
      const prices = PRICES[model];
      if (!vision || !prices) {
        $("costEst").textContent = "~$0.000";
        return;
      }
      const inTok = EST_PROMPT_TOKENS + EST_IMAGE_TOKENS;
      const outTok = EST_OUTPUT_TOKENS;
      const costIn = (inTok / 1_000_000) * prices.in;
      const costOut = (outTok / 1_000_000) * prices.out;
      const total = costIn + costOut;
      $("costEst").textContent = `~$${total.toFixed(4)} (in ${inTok} tok, out ${outTok} tok)`;
    }

    function roleBlock(enabledId, famId, sizeId, boldId, capsId, alignId) {
      const enabled = $(enabledId).checked;
      if (!enabled) return null;
      const fam = $(famId).value.trim();
      const size = parseFloat($(sizeId).value);
      const bold = $(boldId).checked;
      const all_caps = $(capsId).checked;
      const align = $(alignId).value;
      const out = {};
      if (fam) out.family = fam;
      if (!Number.isNaN(size)) out.size_pt = size;
      out.bold = !!bold;
      out.all_caps = !!all_caps;
      if (align) out.align = align;
      return out;
    }

    function collectStyles() {
      const styles = {};
      const t = roleBlock('ovTitle','titleFamily','titleSize','titleBold','titleAllCaps','titleAlign');
      if (t) styles.title = t;
      const s = roleBlock('ovSubtitle','subtitleFamily','subtitleSize','subtitleBold','subtitleAllCaps','subtitleAlign');
      if (s) styles.subtitle = s;
      const a = roleBlock('ovAuthor','authorFamily','authorSize','authorBold','authorAllCaps','authorAlign');
      if (a) styles.author = a;
      return styles;
    }

    function updateModelUIState() {
      const disabled = !$("vision").checked;
      $("modelSel").disabled = disabled;
      $("costEst").style.opacity = disabled ? 0.4 : 1;
      $("minConf").disabled = disabled;
      $("minConfVal").style.opacity = disabled ? 0.4 : 1;
      $("confRow").style.opacity = disabled ? 0.6 : 1;
      estimateCost();
    }

    async function callApi(path, body) {
      const res = await fetch(api(path), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`HTTP ${res.status}: ${txt}`);
      }
      return await res.json();
    }

    function getPayload(isDryRun) {
      const styles = collectStyles();
      return {
        input: $("inputPath").value.trim(),
        config_path: $("configPath").value.trim() || null,
        vision: $("vision").checked,
        no_layout: $("noLayout").checked,
        model: $("modelSel").value,
        scope: ($("scopeWhole") && $("scopeWhole").checked) ? "whole" : "cover",
        min_confidence: parseFloat($("minConf").value),
        ...(Object.keys(styles).length ? { styles } : {}),
        ...(isDryRun ? { dry_run: true } : {})
      };
    }

    function setBusy(on, text) {
      const el = $("busy");
      const t = $("busyText");
      if (text) t.textContent = text;
      el.style.display = on ? 'flex' : 'none';
    }

    function setButtonsDisabled(dis) {
      try { $("btnAnalyze").disabled = dis; } catch {}
      try { $("btnApply").disabled = dis; } catch {}
    }

    function showToast(kind, text, ms = 3500) {
      const box = $("toasts");
      const n = document.createElement('div');
      n.className = `toast ${kind || ''}`;
      n.textContent = text;
      box.appendChild(n);
      setTimeout(() => { try { box.removeChild(n); } catch {} }, ms);
    }

    $("vision").addEventListener('change', updateModelUIState);
    $("modelSel").addEventListener('change', estimateCost);
    $("minConf").addEventListener('input', () => {
      $("minConfVal").textContent = parseFloat($("minConf").value).toFixed(2);
      estimateCost();
    });
    updateModelUIState();

    function populateFontSelect(selId, inputId) {
      const sel = $(selId);
      sel.innerHTML = '';
      const first = document.createElement('option');
      first.value = ''; first.textContent = '(choose)';
      sel.appendChild(first);
      for (const f of FONTS) {
        const opt = document.createElement('option');
        opt.value = f; opt.textContent = f;
        sel.appendChild(opt);
      }
      sel.addEventListener('change', () => {
        if (sel.value) $(inputId).value = sel.value;
      });
    }

    function setRoleEnabled(prefix, enabled) {
      const ids = ["Family","Size","SizeSel","Bold","AllCaps","Align","FontSel"]; // AllCaps matches titleAllCaps etc
      for (const key of ids) {
        const el = document.getElementById(prefix + key);
        if (el) el.disabled = !enabled;
      }
      const card = document.getElementById('card' + prefix.charAt(0).toUpperCase() + prefix.slice(1));
      if (card) card.classList.toggle('muted', !enabled);
    }

    async function loadDocxList() {
      try {
        const res = await fetch(api('/files/simples'));
        const data = await res.json();
        const sel = $("docPicker");
        sel.innerHTML = '';
        const files = (data && data.files) || [];
        for (const f of files) {
          const opt = document.createElement('option');
          opt.value = f; opt.textContent = f;
          sel.appendChild(opt);
        }
        sel.addEventListener('change', () => {
          $("inputPath").value = sel.value || $("inputPath").value;
        });
      } catch {}
    }
    loadDocxList();

    function updateScopeUI() {
      const whole = $("scopeWhole") && $("scopeWhole").checked;
      const coverRow = document.getElementById("coverScope");
      const wholeRow = document.getElementById("wholeScope");
      if (coverRow) coverRow.classList.toggle("muted", whole);
      if (wholeRow) wholeRow.classList.toggle("muted", !whole);
    }
    $("scopeCover").addEventListener('change', updateScopeUI);
    $("scopeWhole").addEventListener('change', updateScopeUI);
    updateScopeUI();

    // Init font dropdowns and Override behavior
    populateFontSelect('titleFontSel','titleFamily');
    populateFontSelect('subtitleFontSel','subtitleFamily');
    populateFontSelect('authorFontSel','authorFamily');
    function populateSizeSelect(selId, inputId) {
      const sel = $(selId);
      sel.innerHTML = '';
      const first = document.createElement('option');
      first.value = ''; first.textContent = '(choose)';
      sel.appendChild(first);
      for (const s of SIZE_PRESETS) {
        const opt = document.createElement('option');
        opt.value = String(s);
        opt.textContent = String(s);
        sel.appendChild(opt);
      }
      sel.addEventListener('change', () => {
        if (sel.value) $(inputId).value = sel.value;
      });
      $(inputId).addEventListener('input', () => {
        const v = String($(inputId).value || '');
        let matched = false;
        for (const opt of sel.options) {
          if (opt.value === v) { sel.value = v; matched = true; break; }
        }
        if (!matched) sel.value = '';
      });
    }
    populateSizeSelect('titleSizeSel','titleSize');
    populateSizeSelect('subtitleSizeSel','subtitleSize');
    populateSizeSelect('authorSizeSel','authorSize');
    const toggleTitle = () => setRoleEnabled('title', $("ovTitle").checked);
    const toggleSubtitle = () => setRoleEnabled('subtitle', $("ovSubtitle").checked);
    const toggleAuthor = () => setRoleEnabled('author', $("ovAuthor").checked);
    $("ovTitle").addEventListener('change', toggleTitle);
    $("ovSubtitle").addEventListener('change', toggleSubtitle);
    $("ovAuthor").addEventListener('change', toggleAuthor);
    // start disabled by default
    setRoleEnabled('title', false);
    setRoleEnabled('subtitle', false);
    setRoleEnabled('author', false);

    function drawOverlay(items) {
      const img = $("coverImg");
      const cvs = $("overlay");
      const show = $("toggleOverlay").checked;
      const wrap = $("imgWrap");
      if (!img.src || !show || !items || !items.length) {
        cvs.width = 0; cvs.height = 0; return;
      }
      const w = img.clientWidth;
      const h = img.clientHeight;
      cvs.width = w; cvs.height = h;
      cvs.style.width = w + 'px';
      cvs.style.height = h + 'px';
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0,0,w,h);
      ctx.lineWidth = 2;
      for (const it of items) {
        const [x,y,bw,bh] = it.bbox || [];
        if (typeof x !== 'number') continue;
        if (it.role === 'title' && !$("showTitle").checked) continue;
        if (it.role === 'subtitle' && !$("showSubtitle").checked) continue;
        if (it.role === 'author' && !$("showAuthor").checked) continue;
        const color = it.role === 'title' ? '#e91e63' : (it.role === 'author' ? '#3f51b5' : '#4caf50');
        ctx.strokeStyle = color;
        ctx.strokeRect(x*w, y*h, bw*w, bh*h);
        // confidence label
        try {
          const conf = typeof it.confidence === 'number' ? it.confidence : undefined;
          if (conf !== undefined) {
            const label = `${it.role} ${(conf*100).toFixed(0)}%`;
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(x*w, y*h - 16, ctx.measureText(label).width + 8, 16);
            ctx.fillStyle = color;
            ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
            ctx.fillText(label, x*w + 4, y*h - 4);
          }
        } catch {}
      }
    }

    async function maybeShowPreview(json) {
      try {
        const v = (json && json.detection && json.detection.vision) || json.vision;
        const items = (json && json.detection && json.detection.vision_items) || json.vision_items;
        const path = v && v.rendered_png;
        if (path && $("vision").checked) {
          $("previewRow").style.display = '';
          const url = `${location.origin}/${path.startsWith('output/') ? path : 'output/' + path}`;
          await new Promise((resolve, reject) => {
            const img = $("coverImg");
            img.onload = () => { drawOverlay(items); resolve(); };
            img.onerror = reject;
            img.src = url;
          });
        } else {
          $("previewRow").style.display = 'none';
        }
      } catch (_) {
        $("previewRow").style.display = 'none';
      }
    }

    $("toggleOverlay").addEventListener('change', () => {
      const jsonTxt = $("output").value.trim();
      if (!jsonTxt) return;
      try { const data = JSON.parse(jsonTxt); drawOverlay(data.vision_items || (data.detection && data.detection.vision_items) || []); } catch {}
    });
    $("showTitle").addEventListener('change', () => $("toggleOverlay").dispatchEvent(new Event('change')));
    $("showSubtitle").addEventListener('change', () => $("toggleOverlay").dispatchEvent(new Event('change')));
    $("showAuthor").addEventListener('change', () => $("toggleOverlay").dispatchEvent(new Event('change')));

    $("btnAnalyze").addEventListener('click', async () => {
      const payload = getPayload(true);
      $("output").value = 'Running /cover/analyze...';
      setBusy(true, 'Analyzing…');
      setButtonsDisabled(true);
      try {
        const json = await callApi('/cover/analyze', payload);
        $("output").value = JSON.stringify(json, null, 2);
        await maybeShowPreview(json);
        showToast('success', 'Analyze completed');
      } catch (e) {
        $("output").value = String(e);
        showToast('error', String(e));
      } finally {
        setBusy(false);
        setButtonsDisabled(false);
      }
    });

    $("btnApply").addEventListener('click', async () => {
      const payload = getPayload(false);
      $("output").value = 'Running /cover/apply...';
      setBusy(true, 'Applying styles…');
      setButtonsDisabled(true);
      try {
        const json = await callApi('/cover/apply', payload);
        $("output").value = JSON.stringify(json, null, 2);
        await maybeShowPreview(json);
        if (json && json.output_path) {
          showToast('success', `Saved: ${json.output_path}`);
        } else {
          showToast('success', 'Apply completed');
        }
      } catch (e) {
        $("output").value = String(e);
        showToast('error', String(e));
      } finally {
        setBusy(false);
        setButtonsDisabled(false);
      }
    });
  </script>
</body>
</html>
