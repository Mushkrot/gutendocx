# GutenDocx Configuration (project-level)
# This file stores your current processing defaults for this project.
# It was created automatically on first run from embedded defaults.
# You may edit it manually or via the application UI; any changes here
# become the defaults for subsequent runs.
# Location: project root (same level as 'Simples' and 'reports').

layout:
  numbering:
    page2_start_value: 1
    print_on_page2: false
  headers:
    show_numpages: false
  blank_page_after_cover: true

roles:
  Title: "Title"
  Subtitle: "Subtitle"
  Author: "Author"
  Body: "Normal"
  Heading1: "Heading 1"
  Heading2: "Heading 2"
  Emphasis: "Emphasis"

cover:
  detect:
    author_markers:
      - "BY"
      - "BY THE AUTHOR"
      - "EDITED BY"
      - "TRANSLATED BY"
      - "PAR"
      - "PAR L’AUTEUR"
      - "TRADUIT PAR"
      - "VON"
      - "HERAUSGEGEBEN VON"
      - "DI"
      - "A CURA DI"
      - "POR"
      - "TRADUCIDO POR"
    year_regex: "\\b(1[5-9]\\d{2}|20\\d{2}|21\\d{2})\\b"
    size_delta_pct: 10
    max_non_empty: 25
  styles:
    title:
      name: "Cover Title"
      font:
        family: "Times New Roman"
        size_pt: 28
        bold: true
        all_caps: true
        align: center
    subtitle:
      name: "Cover Subtitle"
      font:
        family: "Times New Roman"
        size_pt: 18
        bold: false
        all_caps: true
        align: center
    author:
      name: "Cover Author"
      font:
        family: "Times New Roman"
        size_pt: 16
        bold: false
        all_caps: false
        align: center
  normalize:
    collapse_misc_to_normal: true
    preserve_direct_formatting_on_misc: true

style_overrides:
  Title:
    font: "Times New Roman"
    size_pt: 24
    bold: true
    align: "center"
    spacing_after_pt: 12
  Body:
    font: "Times New Roman"
    size_pt: 12
    align: "justify"
    line_spacing: 1.15

remap_rules:
  Body:
    - "Body Text"
    - "Text"
    - "Paragraph"
  Heading1:
    - "Chapter"
    - "Main Heading"
  Heading2:
    - "Subhead"
    - "Subheading"
  default_fallback: "Body"

options:
  remap_styles: false
  normalize_direct_formatting: false
  backup_originals: false

output:
  dir: "output"
  versioning: true
